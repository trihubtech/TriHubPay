<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Vibrant Emerald Brand Gradient for TriHubPay -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#022c22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Premium Emerald Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#innerGlow)" stroke-width="4"/>

  <!-- TriHub Global Network Sphere in Clean White -->
  <g transform="translate(256, 256) scale(1.12) translate(-256, -256)" filter="url(#boltGlow)">
    <!-- Outer Sphere Ring -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.95"/>

    <!-- Vertical Longitude Arc 1 -->
    <ellipse cx="256" cy="256" rx="62" ry="140" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Vertical Longitude Arc 2 (Curved Paths) -->
    <path d="M 200,125 C 275,180 275,330 200,385" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M 312,125 C 237,180 237,330 312,385" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

    <!-- Horizontal Latitude Arcs -->
    <path d="M 130,205 C 190,235 322,235 382,205" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M 130,307 C 190,277 322,277 382,307" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

    <!-- Network Interconnect Connection Nodes (Dots) -->
    <circle cx="160" cy="216" r="12" fill="#ffffff"/>
    <circle cx="160" cy="216" r="6" fill="#059669"/>

    <circle cx="352" cy="216" r="12" fill="#ffffff"/>
    <circle cx="352" cy="216" r="6" fill="#059669"/>

    <circle cx="150" cy="300" r="12" fill="#ffffff"/>
    <circle cx="150" cy="300" r="6" fill="#059669"/>

    <circle cx="362" cy="300" r="12" fill="#ffffff"/>
    <circle cx="362" cy="300" r="6" fill="#059669"/>

    <circle cx="218" cy="256" r="10" fill="#ffffff"/>
    <circle cx="294" cy="256" r="10" fill="#ffffff"/>

    <circle cx="256" cy="116" r="11" fill="#ffffff"/>
    <circle cx="256" cy="396" r="11" fill="#ffffff"/>

    <!-- Central Recharge Lightning Accent Node -->
    <path d="M 264,165 L 230,258 L 266,258 L 242,345 L 290,246 L 254,246 Z" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.3))"/>
  </g>
</svg>
