<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5zm1.5-5.5a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5V7a1.5 1.5 0 0 1 1.5-1.5h1A1.5 1.5 0 0 1 14.5 7z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TriHubPay" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TriHubPay" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        var isAdmin = window.location.pathname.startsWith('/admin') || window.location.hash === '#admin';
        var link = document.querySelector('link[rel="manifest"]');
        if (isAdmin && link) {
          link.setAttribute('href', '/manifest-admin.json');
          document.title = 'TriHub Admin | Control Center';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>TriHubPay | Recharge & Bill Payments</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 24px; box-sizing: border-box; text-align: center;">
        <div style="animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; margin-bottom: 16px;">
          <img src="/trihub_technologies_logo.png" alt="TriHub Technologies" style="width: 120px; height: 120px; object-fit: contain;" />
        </div>
        <h1 style="font-size: 22px; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; letter-spacing: -0.3px;">TriHub <span style="color: #2563eb;">Technologies</span></h1>
        <p style="font-size: 13px; font-weight: 600; color: #059669; margin: 0 0 6px 0; letter-spacing: 0.5px; text-transform: uppercase;">
          TriHubPay Platform
        </p>
        <p style="font-size: 13px; font-weight: 500; color: #64748b; margin: 0 0 24px 0; max-width: 300px; line-height: 1.5;">
          Instant Mobile &amp; DTH Recharges • 100% Reliable
        </p>
        <div style="width: 140px; height: 4px; background: #f1f5f9; border-radius: 999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, #2563eb, #059669); border-radius: 999px; animation: slide 1.2s infinite ease-in-out;"></div>
        </div>
        <div style="margin-top: 24px; font-size: 11px; font-weight: 600; color: #94a3b8; letter-spacing: 0.5px; text-transform: uppercase;">
          Fast • Secure • Wholesale Margins
        </div>
        <style>
          @keyframes slide {
            0% { left: -45%; }
            100% { left: 100%; }
          }
          @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[PWA SW Registration Error]:', err);
          });
        });
      }
    </script>
  </body>
</html>
